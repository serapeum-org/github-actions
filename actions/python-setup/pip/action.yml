name: 'Setup Python with pip'
description: 'Setup Python environment with pip package manager for pyproject.toml projects'

inputs:
  python-version:
    description: >
      Python version to install. Supports semantic versioning and version ranges.
      Examples: "3.12", "3.11", "3.10", "3.9", "3.12.0", "3.x".
      Default is "3.12".
    required: false
    default: '3.12'
  cache:
    description: >
      Dependency caching for pip. Accepts the same boolean-string shape as the uv
      and pixi actions, plus setup-python cache types for advanced use:
      "true" enables caching (uses setup-python's "pip" cache), "false" or ""
      disables it, and "pip" / "pipenv" / "poetry" are passed straight through to
      actions/setup-python. Caching needs the dependency file setup-python hashes
      for the chosen type (pip: pyproject.toml/requirements.txt, pipenv:
      Pipfile.lock, poetry: poetry.lock); if it is absent the action auto-disables
      caching with a warning and still succeeds.
      Examples: "true", "false", "pip", "pipenv", "poetry".
      Default is "true" (caching enabled).
    required: false
    default: 'true'
  install-groups:
    description: >
      Dependency groups (PEP 735) and/or optional dependencies (extras) to install.
      Uses a prefixed format with "groups:" and/or "extras:" sections.
      Space or comma-separated values within each section.
      Leave empty to install only core dependencies.
      Examples: "groups: dev test", "extras: aws viz",
      "groups: dev docs, extras: aws", "extras: test,lint".
      Default is "" (core dependencies only).
    required: false
    default: ''
  architecture:
    description: >
      Target architecture for Python (passed to actions/setup-python).
      Examples: "x64", "x86".
      Default is "x64".
    required: false
    default: 'x64'


runs:
  using: 'composite'
  steps:
    - name: Resolve cache setting
      id: resolve-cache
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
      run: |
        echo "::group::Resolving cache setting"
        # Normalize: lowercase and strip whitespace so "True"/" true "/"TRUE" behave
        # like "true" (portable; avoids bash-4-only ${VAR,,}).
        cache_in="$(printf '%s' "$CACHE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
        # Map the boolean-string shape onto a setup-python cache type. "true" means
        # pip caching; "false"/"" means off; "pip"/"pipenv"/"poetry" pass through.
        case "$cache_in" in
          true|pip) resolved='pip' ;;
          pipenv) resolved='pipenv' ;;
          poetry) resolved='poetry' ;;
          false|'') resolved='' ;;
          *)
            echo "::error::Invalid cache value '${CACHE}'. Use 'true', 'false', 'pip', 'pipenv', or 'poetry'."
            exit 1
            ;;
        esac
        # setup-python hashes a different dependency file per cache type, globbed at
        # any depth (**/). Mirror that so caching is auto-disabled only when it would
        # genuinely find nothing to hash; pip, unlike uv/pixi, can run with no file.
        case "$resolved" in
          pip) dep_globs='pyproject.toml requirements.txt' ;;
          pipenv) dep_globs='Pipfile.lock' ;;
          poetry) dep_globs='poetry.lock' ;;
          *) dep_globs='' ;;
        esac
        if [ -n "$dep_globs" ]; then
          found=''
          for g in $dep_globs; do
            if [ -n "$(find . -path ./.git -prune -o -type f -name "$g" -print 2>/dev/null | head -n1)" ]; then
              found='yes'
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "No dependency file (${dep_globs// /, }) found to hash (cache input was '${CACHE}')."
            echo "::warning::Caching requested but no dependency file found; caching disabled for this run."
            resolved=''
          fi
        fi
        if [ -n "$resolved" ]; then
          echo "Caching enabled (setup-python cache='${resolved}')."
        else
          echo "Caching disabled."
        fi
        echo "cache=${resolved}" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ steps.resolve-cache.outputs.cache }}
        architecture: ${{ inputs.architecture }}

    - name: Upgrade pip
      shell: bash
      env:
        INSTALL_GROUPS: ${{ inputs.install-groups }}
      run: |
        echo "::group::Upgrading pip"
        python -m pip install --upgrade pip
        pip_version=$(pip --version | awk '{print $2}')
        echo "pip upgraded to $pip_version"
        if [[ "$INSTALL_GROUPS" == *"groups:"* ]]; then
          echo "Note: installing PEP 735 dependency groups requires pip >= 25.1."
        fi
        echo "::endgroup::"

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_GROUPS: ${{ inputs.install-groups }}
      run: |
        echo "::group::Installing dependencies"
        if [ -f pyproject.toml ]; then
          echo "Found pyproject.toml, installing package..."

          # Check if install-groups are specified
          if [ -n "$INSTALL_GROUPS" ]; then
            echo "Processing install-groups: $INSTALL_GROUPS"

            input_str="$INSTALL_GROUPS"
            dependency_groups=()
            optional_deps=()
            
            # Extract groups section if present
            if [[ "$input_str" =~ groups:[[:space:]]*([^,]*)(,|$) ]]; then
              groups_part="${BASH_REMATCH[1]}"
              # Remove leading/trailing whitespace and split on spaces
              groups_part=$(echo "$groups_part" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [[ -n "$groups_part" ]]; then
                IFS=' ' read -r -a group_names <<< "$groups_part"
                for group in "${group_names[@]}"; do
                  group=$(echo "$group" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                  if [[ -n "$group" ]]; then
                    dependency_groups+=("$group")
                    echo "  - Found dependency group: $group"
                  fi
                done
              fi
            fi
            
            # Extract extras section if present
            if [[ "$input_str" =~ extras:[[:space:]]*([^,]*)(,|$) ]]; then
              extras_part="${BASH_REMATCH[1]}"
              # Remove leading/trailing whitespace and split on spaces
              extras_part=$(echo "$extras_part" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
              if [[ -n "$extras_part" ]]; then
                IFS=' ' read -r -a extra_names <<< "$extras_part"
                for extra in "${extra_names[@]}"; do
                  extra=$(echo "$extra" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                  if [[ -n "$extra" ]]; then
                    optional_deps+=("$extra")
                    echo "  - Found optional dependency (extra): $extra"
                  fi
                done
              fi
            fi
            
            # Check if neither groups nor extras were found - might be old format
            if [ ${#dependency_groups[@]} -eq 0 ] && [ ${#optional_deps[@]} -eq 0 ]; then
              echo "::warning::No 'groups:' or 'extras:' sections found. Please use format: 'groups: name1 name2, extras: extra1 extra2'"
            fi

            # Summary of what will be installed
            echo ""
            echo "=== Installation Summary ==="
            if [ ${#dependency_groups[@]} -gt 0 ]; then
              echo "✓ Dependency groups will be installed: ${dependency_groups[*]}"
            else
              echo "✗ No dependency groups specified"
            fi
            if [ ${#optional_deps[@]} -gt 0 ]; then
              echo "✓ Optional dependencies (extras) will be installed: ${optional_deps[*]}"
            else
              echo "✗ No optional dependencies specified"
            fi
            echo "✓ Core dependencies will always be installed"
            echo "=========================="
            echo ""

            # Install the package first
            if [ ${#optional_deps[@]} -gt 0 ]; then
              # Build comma-separated list of optional dependencies for pip install .[extras]
              extras_list=""
              for extra in "${optional_deps[@]}"; do
                if [[ -z "$extras_list" ]]; then
                  extras_list="$extra"
                else
                  extras_list="$extras_list,$extra"
                fi
              done
              install_target=".[$extras_list]"
              echo "Installing package with optional dependencies: pip install $install_target"
              pip install "$install_target"
            else
              echo "Installing package without optional dependencies..."
              pip install .
            fi

            # Install dependency groups if any (requires pip with PEP 735 support)
            if [ ${#dependency_groups[@]} -gt 0 ]; then
              # Build command with multiple --group flags
              dep_groups_args=()
              for group in "${dependency_groups[@]}"; do
                dep_groups_args+=("--group" "$group")
              done
              
              # Dependency groups (pip install --group) are a PEP 735 feature
              # that requires pip >= 25.1. Validate support before installing so
              # a missing feature fails the job loudly instead of silently
              # skipping the requested groups.
              pip_version=$(pip --version | awk '{print $2}')
              # Capture the help text before grepping so pipefail cannot surface a
              # SIGPIPE (141) from grep -q closing the pipe early now that the
              # unsupported branch is fatal.
              group_help="$(pip install --help)"
              if grep -q -- "--group" <<<"$group_help"; then
                echo "Installing dependency groups: pip install . ${dep_groups_args[*]}"
                pip install . "${dep_groups_args[@]}"
              else
                groups_list=$(IFS=,; echo "${dependency_groups[*]}")
                echo "::error::pip $pip_version does not support the --group flag (PEP 735 dependency groups)."
                echo "::error::Dependency groups were explicitly requested ($groups_list) but cannot be installed, so this step is failing instead of silently skipping them."
                echo "::error::Upgrade to pip >= 25.1 (which ships the --group option), or use the uv action (serapeum-org/github-actions/actions/python-setup/uv) which has native PEP 735 support."
                exit 1
              fi
            fi
          else
            echo "Installing package without optional groups or extras..."
            pip install .
          fi
        else
          echo "No pyproject.toml found - skipping package installation"
        fi
        echo "::endgroup::"

    - name: List installed packages
      shell: bash
      run: |
        echo "::group::Installed packages summary"
        pip list
        echo "::endgroup::"