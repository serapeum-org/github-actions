[build-system]
# Pin hatchling to a release that stamps Metadata-Version 2.4. Newer hatchling
# emits Metadata-Version 2.5 (PEP 794), which twine 6.2.0 rejects on upload:
# twine hardcodes the metadata versions it accepts up to 2.4 (see
# twine/package.py `_VALID_METADATA_VERSIONS`), so a 2.5 distribution fails with
# "InvalidDistribution: '2.5' is not a valid metadata version" — the pixi publish
# job hit exactly this. Lift the pin once twine supports metadata 2.5.
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "serapeum-actions-pypi-test"
version = "0.1.0"
description = "CI test package for the serapeum-github-actions PyPI release composite action"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/serapeum_actions_pypi_test"]

[tool.hatch.build.targets.sdist]
# Explicitly restrict sdist to project files only.
# Without this, hatchling includes everything in the working directory,
# which in CI is the entire repository checkout (~800 kB of unrelated files).
include = [
    "src/",
    "README.md",
    "pyproject.toml",
]
