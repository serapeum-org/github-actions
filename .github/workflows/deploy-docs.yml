name: Deploy Documentation

# Builds the MkDocs site, generates the action reference pages, and publishes to
# the gh-pages branch with mike (version "main", aliased "latest", set default).
# Called by ci.yml on every merge to main; also runnable manually. It performs a
# real `mike deploy --push`, so it carries a concurrency guard (below) to keep
# two merges from racing on the gh-pages push.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

# Serialize the gh-pages push: two merges landing close together would
# otherwise run `mike deploy --push` in parallel and collide (non-fast-forward).
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          pip install mkdocs mkdocs-material pymdown-extensions mike

      - name: Generate action reference pages
        run: python scripts/generate_action_docs.py

      - name: Configure Git
        env:
          GIT_ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$GIT_ACTOR"
          git config --global user.email "${GIT_ACTOR}@users.noreply.github.com"

      - name: Deploy with mike
        run: |
          mike deploy --push --update-aliases main latest
          mike set-default --push latest
